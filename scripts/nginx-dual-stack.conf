# Added by receipt-wrangler-railway.
# Upstream's server block has `listen 80;` only, which binds IPv4. Container platforms that reach
# services over IPv6 (Railway's private network among them) cannot connect to an IPv4-only socket,
# so this adds the IPv6 listener for the same server. `ipv6only=on` keeps the two sockets separate
# and avoids "address already in use" against the existing IPv4 listener.
server {
    listen [::]:80 ipv6only=on;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location /oauth/ {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server { proxy_pass http://localhost:8081; proxy_set_header Host $host; }
    location = /.well-known/oauth-protected-resource   { proxy_pass http://localhost:8081; proxy_set_header Host $host; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
